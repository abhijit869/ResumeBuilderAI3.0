# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: web
    name: resumebuilderai
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build:render
    startCommand: node .next/standalone/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOSTNAME
        value: 0.0.0.0
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: GEMINI_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: resumebuilderai_db
